[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-ap2-x402-verifier"
version = "0.1.0"
description = "Independent offline evaluation for the pinned Pulse AP2 to x402 corpus"
requires-python = ">=3.11"
dependencies = [
  "ap2 @ git+https://github.com/google-agentic-commerce/AP2.git@e1ea56db72a6385bce3e5c1112b3a56ce60acb43",
  "eth-account==0.14.0",
  "jwcrypto==1.5.6",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
